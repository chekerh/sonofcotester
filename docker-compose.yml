services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: sonofcotester
      POSTGRES_PASSWORD: sonofcotester
      POSTGRES_DB: sonofcotester
    ports:
      - "127.0.0.1::5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonofcotester -d sonofcotester"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7
    ports:
      - "127.0.0.1::6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
